<!--
The progress indicator only shows while the button is disabled, so color it like disabled content
-->
<button
    [matButton]="appearance()"
    class="[--mat-button-filled-progress-active-indicator-color:var(--mat-sys-on-surface)]"
    type="button"
    [disabled]="disabled()"
    disabledInteractive
    [showProgress]="loading()"
    [attr.aria-label]="loading() ? loadingLabel() : null"
    [matTooltip]="disabledReason() ?? ''"
    (click)="disabled() || press.emit()">
    <!--
    Reproject icons so that the button lays them out as icons instead of label content.

    For reprojection to work properly, ngProjectAs has to exactly match one of the selectors listed
    at
    https://github.com/angular/components/blob/e28b22e2cc28e7e6bc0850e9a9e7f076e7c75428/src/material/button/button.html#L8.
    -->
    <ng-container ngProjectAs="[matButtonIcon]:not([iconPositionEnd])">
        <ng-content select="mat-icon, [matButtonIcon]" />
    </ng-container>
    <ng-content />
    <!--
    Set tabindex="" to make the progress spinner noninteractable. See
    https://material.angular.dev/components/button/overview#buttons-with-progress-indicators.
    -->
    <mat-progress-spinner progressIndicator mode="indeterminate" diameter="18" tabindex="" />
</button>
