<acc-app-draft-editor-content
    *accLoadablePage="state(); let loaded"
    [state]="loaded"
    (saveListing)="saveListing.emit($event)"
    (reloadListing)="reloadListing.emit()"
    (deleteAppDraft)="deleteAppDraft.emit()"
    (dismissSaveListingError)="dismissSaveListingError.emit()"
    (dismissDeleteAppDraftError)="dismissDeleteAppDraftError.emit()" />
