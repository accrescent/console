<main class="flex min-h-full flex-col p-6">
    @let currentState = state();
    @let kind = currentState.kind;
    @switch (kind) {
        @case ("loading") {
            <div class="m-auto">
                <mat-progress-spinner mode="indeterminate" aria-label="Loading" />
            </div>
        }
        @case ("error") {
            <acc-full-page-error-view [error]="currentState.error" />
        }
        @case ("loaded") {
            @let organization = currentState.organization;
            <div class="mx-auto flex w-full max-w-5xl flex-col gap-8">
                <h1 class="[font:var(--mat-sys-headline-medium)]">Dashboard</h1>

                <section class="flex flex-col gap-4">
                    <h2 class="[font:var(--mat-sys-title-large)]">App limits</h2>

                    <div class="grid gap-6 sm:grid-cols-2">
                        <acc-quota-card
                            label="Published apps"
                            description="Apps available in the store"
                            icon="storefront"
                            [count]="organization.publishedAppCount"
                            [limit]="organization.publishedAppLimit"
                            fullAction="Check back later for a way to increase this limit." />
                        <acc-quota-card
                            label="App drafts"
                            description="New apps that aren't published yet"
                            icon="draft"
                            [count]="organization.activeAppDraftCount"
                            [limit]="organization.activeAppDraftLimit"
                            fullAction="Delete or publish an app draft to create another one." />
                    </div>
                </section>
            </div>
        }
        @default never;
    }
</main>
