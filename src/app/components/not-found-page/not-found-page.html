<main class="flex min-h-screen items-center justify-center p-4">
    <div
        class="flex w-full max-w-md flex-col items-center gap-6 rounded-(--mat-sys-corner-extra-large) border border-(--mat-sys-outline-variant) bg-(--mat-sys-surface-container) px-8 py-10 text-center shadow-(--mat-sys-level1)">
        <img [src]="accrescentLogo" alt="Accrescent logo" width="96" height="96" />
        <div class="flex flex-col gap-2">
            <h1 class="[font:var(--mat-sys-headline-small)]">Page not found</h1>
            <p class="text-(--mat-sys-on-surface-variant)">
                The page you're looking for doesn't exist or has been moved.
            </p>
        </div>

        <a matButton="filled" routerLink="/">Go home</a>
    </div>
</main>
